<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A beautiful digital sketchbook showcasing artwork in an interactive carousel with an open-book design." />
  <title>Kalakriti — Digital Sketchbook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app">

    <!-- ═══════ Header ═══════ -->
    <header class="header">
      <div class="stamp" title="Kalakriti">
        <svg class="stamp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19l7-7 3 3-7 7-3-3z"/>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
          <path d="M2 2l7.586 7.586"/>
          <circle cx="11" cy="11" r="2"/>
        </svg>
        <div class="stamp-text">
          <span class="stamp-top">KALA</span>
          <span class="stamp-bottom">KRITI</span>
        </div>
      </div>
      <button class="info-btn" title="About this sketchbook" aria-label="Info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="16" x2="12" y2="12" />
          <line x1="12" y1="8" x2="12.01" y2="8" />
        </svg>
      </button>
    </header>

    <!-- ═══════ Artwork Name ═══════ -->
    <div class="page-info">
      <h1 class="artwork-name" id="page-name"></h1>
    </div>

    <!-- ═══════ Carousel ═══════ -->
    <div class="carousel-wrapper">
      <button class="nav-arrow nav-left" id="nav-left" aria-label="Previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>

      <div class="carousel-viewport" id="carousel-viewport">
        <!-- Carousel items rendered by JS -->
      </div>

      <button class="nav-arrow nav-right" id="nav-right" aria-label="Next page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 6 15 12 9 18" />
        </svg>
      </button>
    </div>

    <!-- ═══════ Navigation Dots ═══════ -->
    <div class="dots-container" id="dots-container"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
